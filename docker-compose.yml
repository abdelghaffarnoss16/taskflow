version: "3.9"

# TaskFlow local development / demo stack.
# Run with: docker compose up --build
#
# Services communicate over the "taskflow-network" bridge network:
#   frontend (Nginx, port 80 -> host 3000)
#   backend  (FastAPI/Uvicorn, port 8000 -> host 8000)
#   db       (PostgreSQL, port 5432 -> host 5432)

services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@db:5432/taskflow
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_VERSION: 1.0.0
      APP_NAME: TaskFlow API
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - taskflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  taskflow-db-data:
